name: Build thunderz

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build
        run: make

      - name: Create CVBI
        run: |
          cp bootloader.elf cvbi/thunderz.elf
          cd cvbi
          python3 -c "
          import zipfile
          with zipfile.ZipFile('../thunderz.cvbi', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('rom-data.json')
              z.write('thunderz.elf')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderz
          path: |
            bootloader.elf
            kernel.elf
            kernel.bin
            disk.img
            thunderz.cvbi
          retention-days: 7

      - name: Show artifact info
        run: ls -la bootloader.elf kernel.elf kernel.bin disk.img thunderz.cvbi
